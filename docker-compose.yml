services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - ./backend/.env
    environment:
      API_PREFIX: /api
      DATA_DIR: /data
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      AWS_ENDPOINT_URL: http://aws:4566
      AWS_DYNAMODB_ENDPOINT_URL: http://aws:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/data
    depends_on:
      redis:
        condition: service_healthy
      aws-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Transcoding is CPU-bound and ffmpeg/x264 already parallelizes a single
    # encode across cores. Pin a LOW prefork concurrency so we don't run N
    # ffmpeg jobs that fight over the same cores. prefetch-multiplier=1 stops a
    # process from hoarding queued long-running tasks so work spreads evenly.
    # Tune CELERY_CONCURRENCY up only if the host has spare cores.
    command: >
      celery -A app.workers.celery_app:celery_app worker
      --loglevel=info
      --concurrency=${CELERY_CONCURRENCY:-2}
      --prefetch-multiplier=1
    env_file:
      - ./backend/.env
    environment:
      DATA_DIR: /data
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-2}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      AWS_ENDPOINT_URL: http://aws:4566
      AWS_DYNAMODB_ENDPOINT_URL: http://aws:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./backend:/app
      - ./data:/data
    depends_on:
      redis:
        condition: service_healthy
      aws-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: pnpm dev -- --host 0.0.0.0
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local AWS emulator (S3 + DynamoDB) — moto server, the same library the
  # test suite mocks AWS with. Free, no account or token. State is in-memory
  # and resets when the container restarts. For real AWS see the README.
  aws:
    image: motoserver/moto:5.1.22
    command: ["-H", "0.0.0.0", "-p", "4566"]
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4566/moto-api/')"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the bucket (CORS + versioning) and the DynamoDB table +
  # GSIs — the same resources as infra/terraform. Idempotent.
  aws-init:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "scripts/init_aws.py"]
    env_file:
      - ./backend/.env
    environment:
      AWS_ENDPOINT_URL: http://aws:4566
      AWS_DYNAMODB_ENDPOINT_URL: http://aws:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    volumes:
      - ./backend:/app
    depends_on:
      aws:
        condition: service_healthy

volumes:
  frontend-node-modules:
  redis-data:
